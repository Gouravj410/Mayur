{% extends "base.html" %}

{% block title %}Edit Bill #INV-{{ bill.id }} - AutoCareHub{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5">
                <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
                    <div class="bg-secondary text-white p-3 rounded-circle">
                        <i class="bi bi-pencil-square fs-3"></i>
                    </div>
                    <div>
                        <h4 class="fw-bold mb-0">Adjust Invoice Charges</h4>
                        <p class="text-muted small mb-0">#INV-{{ bill.id }} &bull; {{ bill.customer_name }}</p>
                    </div>
                </div>

                <form method="POST" action="{{ url_for('billing.edit_bill', bill_id=bill.id) }}">
                    <div class="mb-3">
                        <label class="form-label">Service Labor Charge (₹) <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" id="service_charge" name="service_charge" class="form-control" value="{{ bill.service_charge }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Spare Parts Charge (₹ - Calculated from Job Card)</label>
                        <input type="number" step="0.01" id="parts_charge" class="form-control bg-light" value="{{ bill.parts_charge }}" readonly>
                        <small class="text-muted">Parts charges are calculated automatically from parts assigned to the repair card.</small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Total Amount (₹)</label>
                        <input type="number" step="0.01" id="total_amount" class="form-control bg-light fw-bold" value="{{ bill.total_amount }}" readonly>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Payment Status</label>
                        <select name="payment_status" class="form-select">
                            <option value="Pending" {% if bill.payment_status == 'Pending' %}selected{% endif %}>Pending</option>
                            <option value="Paid" {% if bill.payment_status == 'Paid' %}selected{% endif %}>Paid</option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('billing.view_bill', bill_id=bill.id) }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-primary fw-semibold px-4">
                            <i class="bi bi-save me-1"></i> Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
