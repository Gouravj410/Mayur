{% extends "base.html" %}

{% block title %}Add Spare Part - AutoCareHub{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5">
                <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
                    <div class="bg-primary text-white p-3 rounded-circle">
                        <i class="bi bi-box-seam-fill fs-3"></i>
                    </div>
                    <div>
                        <h4 class="fw-bold mb-0">Add Spare Part to Stock</h4>
                        <p class="text-muted small mb-0">Register a new inventory component</p>
                    </div>
                </div>

                <form method="POST" action="{{ url_for('parts.add_part') }}">
                    <div class="mb-3">
                        <label class="form-label">Part Name / Description <span class="text-danger">*</span></label>
                        <input type="text" name="part_name" class="form-control" placeholder="e.g. Front Ceramic Brake Pads" value="{{ form.get('part_name', '') }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Part Number / SKU Code <span class="text-danger">*</span></label>
                        <input type="text" name="part_number" class="form-control text-uppercase font-monospace" placeholder="e.g. BRK-PAD-FR01" value="{{ form.get('part_number', '') }}" required>
                        <small class="text-muted">Must be a unique inventory code</small>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Initial Stock Quantity <span class="text-danger">*</span></label>
                            <input type="number" name="quantity" class="form-control" placeholder="10" min="0" value="{{ form.get('quantity', '') }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Unit Selling Price (₹) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" name="unit_price" class="form-control" placeholder="950.00" min="0" value="{{ form.get('unit_price', '') }}" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Technical Specifications / Description</label>
                        <textarea name="description" class="form-control" rows="3" placeholder="Compatibility, brand, grade, viscosity...">{{ form.get('description', '') }}</textarea>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('parts.list_parts') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-primary fw-semibold px-4">
                            <i class="bi bi-check-lg me-1"></i> Register Part
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
