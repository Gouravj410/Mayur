{% extends "base.html" %}

{% block title %}Edit Spare Part - AutoCareHub{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5">
                <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
                    <div class="bg-secondary text-white p-3 rounded-circle">
                        <i class="bi bi-pencil-square fs-3"></i>
                    </div>
                    <div>
                        <h4 class="fw-bold mb-0">Modify Spare Part</h4>
                        <p class="text-muted small mb-0">{{ part.part_name }} ({{ part.part_number }})</p>
                    </div>
                </div>

                <form method="POST" action="{{ url_for('parts.edit_part', part_id=part.id) }}">
                    <div class="mb-3">
                        <label class="form-label">Part Name / Description <span class="text-danger">*</span></label>
                        <input type="text" name="part_name" class="form-control" value="{{ part.part_name }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Part Number / SKU Code <span class="text-danger">*</span></label>
                        <input type="text" name="part_number" class="form-control text-uppercase font-monospace" value="{{ part.part_number }}" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Available Stock Quantity <span class="text-danger">*</span></label>
                            <input type="number" name="quantity" class="form-control" value="{{ part.quantity }}" min="0" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Unit Price (₹) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" name="unit_price" class="form-control" value="{{ part.unit_price }}" min="0" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Description / Specifications</label>
                        <textarea name="description" class="form-control" rows="3">{{ part.description or '' }}</textarea>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('parts.list_parts') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-primary fw-semibold px-4">
                            <i class="bi bi-save me-1"></i> Update Part
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
